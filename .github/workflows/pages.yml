name: Refresh exchange rates and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:17 and 18:17 Asia/Seoul. GitHub schedules may start later under load.
    - cron: "17 21,9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-market-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify browser collections, store rates and publish data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/finish-browser-market.py
            python3 scripts/refresh-fx.py --allow-cached --root market-data
            git add market-data
            for folder in pending-market collection-results; do
              if [ -d "$folder" ] || git ls-files --error-unmatch "$folder" >/dev/null 2>&1; then
                git add -A -- "$folder"
              fi
            done
            if git diff --cached --quiet; then break; fi
            git commit -m 'data: 브라우저 수집 검증과 환율 보관'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets market-data _site/
          if [ -d collection-results ]; then cp -R collection-results _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
